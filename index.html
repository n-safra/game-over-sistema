<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Game Over - entre na sua conta para acessar seu perfil e sua estante de jogos.">
    <title>Entrar | Game Over</title>

    <link rel="icon" href="img/logo.svg" type="image/svg+xml">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-login">

    <main class="container-fluid p-0">
        <div class="row g-0 min-vh-100">

            <!-- Lado da imagem -->
            <div class="col-lg-6 login-hero">
                <img
                    src="img/login-hero-800.webp"
                    srcset="img/login-hero-800.webp 800w, img/login-hero-1400.webp 1400w"
                    sizes="(min-width: 992px) 50vw, 100vw"
                    width="800" height="600"
                    alt="Paisagem retrô em pixel art com sol no horizonte e grade neon"
                    class="login-hero-img">
                <div class="login-hero-texto">
                    <p class="logo-texto mb-2">GAME OVER</p>
                    <p class="mb-0">Sua estante de jogos, suas notas, seu progresso.</p>
                </div>
            </div>

            <!-- Lado do formulário -->
            <div class="col-lg-6 d-flex align-items-center justify-content-center p-4">
                <section class="cartao login-cartao" aria-labelledby="titulo-login">

                    <div class="text-center mb-4">
                        <img src="img/logo.svg" alt="" width="56" height="56" class="mb-3">
                        <h1 id="titulo-login" class="h3 fw-bold">Entrar</h1>
                        <p class="texto-suave mb-0">Continue de onde parou.</p>
                    </div>

                    <!-- Mensagem de erro geral (lida por leitores de tela) -->
                    <div id="alerta-login" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>

                    <form id="form-login" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" id="email" name="email" class="form-control"
                                   placeholder="voce@exemplo.com" autocomplete="email" required
                                   aria-describedby="erro-email">
                            <div id="erro-email" class="invalid-feedback">Digite um e-mail válido.</div>
                        </div>

                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha</label>
                            <div class="input-group has-validation">
                                <input type="password" id="senha" name="senha" class="form-control"
                                       placeholder="Mínimo de 6 caracteres" autocomplete="current-password"
                                       minlength="6" required aria-describedby="erro-senha">
                                <button type="button" id="btn-ver-senha" class="btn btn-outline-secondary"
                                        aria-label="Mostrar senha" aria-pressed="false">Mostrar</button>
                                <div id="erro-senha" class="invalid-feedback">A senha precisa ter pelo menos 6 caracteres.</div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input type="checkbox" id="lembrar" name="lembrar" class="form-check-input">
                                <label for="lembrar" class="form-check-label">Lembrar de mim</label>
                            </div>
                            <a href="#" class="link-destaque">Esqueci a senha</a>
                        </div>

                        <button type="submit" class="btn btn-primario w-100">Entrar</button>
                    </form>

                    <!-- Dados para teste (o projeto é só front-end) -->
                    <div class="dica-teste mt-4">
                        <p class="mb-1 fw-semibold">Conta de teste</p>
                        <p class="mb-0">E-mail: <code>jogador@gameover.com</code></p>
                        <p class="mb-0">Senha: <code>gameover123</code></p>
                    </div>

                </section>
            </div>

        </div>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
